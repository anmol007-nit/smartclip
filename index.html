<!DOCTYPE html>
<html>
<head>
  <title>SmartClip – AI Video Editing Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to right, #f4f4f4, #e8f0ff);
      margin: 0;
      padding: 50px;
    }
    h1 {
      color: #2c3e50;
      font-size: 48px;
    }
    p {
      font-size: 20px;
      color: #555;
    }
    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: 0.3s;
    }
    .button:hover {
      background: #2980b9;
      transform: scale(1.05);
    }
    .form-box {
      margin-top: 40px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: inline-block;
    }
    input[type="email"] {
      padding: 10px;
      width: 250px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    input[type="submit"] {
      padding: 10px 20px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 5px;
      margin-left: 10px;
      cursor: pointer;
      transition: 0.3s;
    }
    input[type="submit"]:hover {
      background: #1e8449;
    }
  </style>
</head>
<body>
  <h1>SmartClip</h1>
  <p>Edit Smarter, Learn Faster</p>
  <p>AI-powered video editing for Gen Z creators.</p>
  <a href="#" class="button">Watch Demo</a>

  <div class="form-box">
    <h3>Join Our Beta</h3>
    <form>
      <input type="email" placeholder="Enter your email" required>
      <input type="submit" value="Sign Up">
    </form>
  </div>
</body>
</html>
